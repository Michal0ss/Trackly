name: keepalive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --max-time 60
          https://trackly-api-git-main-michal-team00.vercel.app/api/health
